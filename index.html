<body>
<div id="app">
  <header class="topbar" id="topbar"></header>
  <main id="screen" aria-live="polite"></main>
  <footer class="credit app-credit">
    <span>تصميم وتطوير</span>
    <b>Mahmoud Rabea Hassan</b>
    <span class="role">Software Engineer</span>
  </footer>
</div>
<div id="fx" aria-hidden="true"></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="الإعدادات">
  <div class="panel">
    <h3>⚙️ الإعدادات</h3>
    <div class="row"><span>🔊 نطق الأسئلة</span><button class="switch" id="swSpeech" role="switch"></button></div>
    <div class="row"><span>🎵 أصوات اللعبة</span><button class="switch" id="swSfx" role="switch"></button></div>
    <div class="row"><span>🔓 فتح كل المراحل (للتطوير)</span><button class="switch" id="swDev" role="switch"></button></div>
    <div class="row"><span>🎤 صوت القراءة</span><button class="btn ghost" id="btnTest" style="padding:8px 16px;margin:0">جرّب</button></div>
    <div id="voiceInfo" class="note"></div>
    <div class="row"><span>📘 دليل الوالدين</span><button class="btn ghost" id="btnGuide" style="padding:8px 16px;margin:0">افتح</button></div>
    <div class="row"><span>👨‍👩‍👦 لوحة ولي الأمر</span><button class="btn ghost" id="btnParent" style="padding:8px 16px;margin:0">افتح</button></div>
    <div class="center" style="margin-top:16px">
      <button class="btn ghost" id="btnReset">🗑️ إعادة ضبط التقدم</button>
      <button class="btn" id="btnCloseSheet">تمام</button>
    </div>
    <div class="credit sheet-credit">
      <span>رحلتي التعليمية — تصميم وتطوير</span>
      <b>Mahmoud Rabea Hassan</b>
      <span class="role">Software Engineer</span>
    </div>
  </div>
</div>
